
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
<title>Listado - Mundial</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}"><i class="bi bi-trophy-fill"></i> Mundial</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-pencil-square"></i> Registrar</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/listar}"><i class="bi bi-table"></i> Listado</a></li>
      </ul>
    </div>
  </div>
</nav>

<header class="pitch py-5">
  <div class="container py-lg-4">
    <h1 class="mb-3">Mundiales y equipos registrados</h1>
    <p class="fs-5 mb-0">Consulta lo que ya guardaste en MongoDB Atlas y elimina lo que ya no necesites.</p>
  </div>
</header>

<main class="container my-5">
  <ul class="nav nav-tabs mb-4" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabM" type="button" role="tab">Mundiales <span class="badge badge-team" id="cntM">0</span></button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabE" type="button" role="tab">Equipos <span class="badge badge-team" id="cntE">0</span></button>
    </li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tabM" role="tabpanel">
      <div class="panel p-0 table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Año</th><th>Torneo</th><th>Sede</th><th>Campeón</th><th>Participantes</th><th></th></tr></thead>
          <tbody id="tablaMundiales"></tbody>
        </table>
      </div>
    </div>
    <div class="tab-pane fade" id="tabE" role="tabpanel">
      <div class="panel p-0 table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Equipo</th><th>Confederación</th><th>Entrenador</th><th>Mundiales ganados</th><th></th></tr></thead>
          <tbody id="tablaEquipos"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="avisos"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
