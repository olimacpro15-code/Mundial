
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
<title>Registrar - Mundial</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}"><i class="bi bi-trophy-fill"></i> Mundial</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/}"><i class="bi bi-pencil-square"></i> Registrar</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/listar}"><i class="bi bi-table"></i> Listado</a></li>
      </ul>
    </div>
  </div>
</nav>

<header class="pitch py-5">
  <div class="container py-lg-4">
    <h1 class="mb-3">Registra equipos y Mundiales</h1>
    <p class="fs-5 mb-0">Primero crea los equipos. Después arma cada Mundial con su sede, su campeón y los equipos que participaron.</p>
  </div>
</header>

<main class="container my-5">
  <div class="row g-4">
    <div class="col-lg-5">
      <section class="panel h-100">
        <h2 class="mb-4">Nuevo equipo</h2>
        <form id="formEquipo">
          <div class="mb-3">
            <label class="form-label" for="eNombre">Nombre</label>
            <input id="eNombre" name="nombre" class="form-control" required maxlength="60" placeholder="Colombia">
          </div>
          <div class="mb-3">
            <label class="form-label" for="eConf">Confederación</label>
            <select id="eConf" name="confederacion" class="form-select" required>
              <option value="" selected disabled>Selecciona una</option>
              <option>CONMEBOL</option><option>UEFA</option><option>CONCACAF</option>
              <option>CAF</option><option>AFC</option><option>OFC</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="eEntrenador">Entrenador</label>
            <input id="eEntrenador" name="entrenador" class="form-control" maxlength="60">
          </div>
          <div class="mb-4">
            <label class="form-label" for="eTitulos">Mundiales ganados</label>
            <input id="eTitulos" name="titulos" type="number" min="0" value="0" class="form-control">
          </div>
          <button class="btn btn-turf w-100" type="submit"><i class="bi bi-plus-circle"></i> Guardar equipo</button>
        </form>
      </section>
    </div>

    <div class="col-lg-7">
      <section class="panel h-100">
        <h2 class="mb-4">Nuevo Mundial</h2>
        <form id="formMundial">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label" for="mNombre">Nombre del torneo</label>
              <input id="mNombre" name="nombre" class="form-control" required maxlength="80" placeholder="Copa Mundial de la FIFA 2026">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="mAnio">Año</label>
              <input id="mAnio" name="anio" type="number" min="1930" max="2100" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="mSede">Sede</label>
              <input id="mSede" name="sede" class="form-control" required maxlength="80" placeholder="Estados Unidos, México y Canadá">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="mCampeon">Campeón</label>
              <select id="mCampeon" class="form-select"></select>
            </div>
            <div class="col-12">
              <label class="form-label" for="mEquipos">Equipos participantes</label>
              <select id="mEquipos" class="form-select" multiple size="6"></select>
              <div class="form-text">Mantén Ctrl (⌘ en Mac) para elegir varios equipos.</div>
            </div>
            <div class="col-12">
              <button class="btn btn-turf w-100" type="submit"><i class="bi bi-plus-circle"></i> Guardar Mundial</button>
            </div>
          </div>
        </form>
      </section>
    </div>
  </div>
</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="avisos"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
